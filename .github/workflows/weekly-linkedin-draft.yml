name: Weekly LinkedIn — Topic Proposals

on:
  schedule:
    - cron: '0 6 * * 0'   # Sunday 06:00 UTC (09:00 IST)
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date for re-run (YYYY-MM-DD, optional)'
        required: false
        default: ''

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate LinkedIn draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OVERRIDE_DATE:     ${{ inputs.date }}
        run: python T-tools/generate-draft.py

      - name: Commit research to main
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add O-output/ || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "auto: W$(date +%V) topic proposals + research brief"
          git push origin main
