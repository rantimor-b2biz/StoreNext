name: Generate Article + LinkedIn Post (weekly, email delivery)

on:
  schedule:
    # Monday ~08:30 Israel time, 3 attempts (GitHub cron is unreliable);
    # the guard step ensures only the first successful run of the week generates.
    - cron: "30 5 * * 1"
    - cron: "30 6 * * 1"
    - cron: "30 7 * * 1"
  workflow_dispatch:
    inputs:
      topic:
        description: "Manual topic override (optional — otherwise trending topic is auto-selected)"
        required: false

# Never run two generations in parallel (they race on the git push)
concurrency:
  group: article-post-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if this week already done (scheduled runs only)
        id: guard
        run: |
          WEEK="W$(date +%V)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "O-output/${WEEK}/final/final-post.md" ]; then
            echo "Content for ${WEEK} already exists — a previous run handled this week. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: pip install anthropic pillow cairosvg lxml python-docx

      - name: Generate article + post + visual, send email
        if: steps.guard.outputs.skip == 'false'
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          RECIPIENT_MAIL: ${{ secrets.RECIPIENT_MAIL }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python3 T-tools/scripts/generate_article_and_post.py --topic "${{ github.event.inputs.topic }}"
          else
            python3 T-tools/scripts/generate_article_and_post.py
          fi

      - name: Commit output
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "StoreNext Bot"
          git config user.email "rantimor@gmail.com"
          git add O-output/ B-brain/topic-history.json
          git diff --staged --quiet || git commit -m "auto: ${{ steps.generate.outputs.week }} article + post — ${{ steps.generate.outputs.topic }}"
          # Ran's machine auto-syncs this repo, so pushes can race. Rebase and retry.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then break; fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 10
          done

      - name: Summary
        if: steps.guard.outputs.skip == 'false'
        run: |
          {
            echo "## ${{ steps.generate.outputs.week }} — ${{ steps.generate.outputs.topic }}"
            echo ""
            echo "Gatekeeper: ${{ steps.generate.outputs.verdict }} — content emailed to Ran for manual upload."
            echo ""
            cat "O-output/${{ steps.generate.outputs.week }}/final/final-post.md"
          } >> "$GITHUB_STEP_SUMMARY"
