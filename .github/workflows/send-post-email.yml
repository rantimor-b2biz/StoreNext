name: Send Weekly Post Email

on:
  push:
    branches: [main]
    paths:
      - 'O-output/W*/final/final-post.md'

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find changed post file
        id: find_post
        run: |
          POST_FILE=$(git diff --name-only HEAD~1 HEAD \
            | grep -E 'O-output/W[0-9]+/final/final-post\.md' \
            | head -1)

          if [ -z "$POST_FILE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          WEEK=$(echo "$POST_FILE" | cut -d'/' -f2)
          WEEK_FOLDER=$(echo "$POST_FILE" | cut -d'/' -f1-2)
          VISUAL_FILE="$WEEK_FOLDER/final/visual.html"

          echo "skip=false"             >> $GITHUB_OUTPUT
          echo "post_file=$POST_FILE"   >> $GITHUB_OUTPUT
          echo "week=$WEEK"             >> $GITHUB_OUTPUT
          echo "week_folder=$WEEK_FOLDER" >> $GITHUB_OUTPUT
          echo "visual_file=$VISUAL_FILE" >> $GITHUB_OUTPUT

          if [ -f "$VISUAL_FILE" ]; then
            echo "has_visual=true" >> $GITHUB_OUTPUT
          else
            echo "has_visual=false" >> $GITHUB_OUTPUT
          fi

      - name: Send email with post
        if: steps.find_post.outputs.skip == 'false'
        env:
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          POST_FILE:      ${{ steps.find_post.outputs.post_file }}
          VISUAL_FILE:    ${{ steps.find_post.outputs.visual_file }}
          HAS_VISUAL:     ${{ steps.find_post.outputs.has_visual }}
          WEEK:           ${{ steps.find_post.outputs.week }}
        run: |
          python3 - <<'EOF'
          import smtplib, os
          from email.mime.text      import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.mime.base      import MIMEBase
          from email                import encoders

          post_file   = os.environ['POST_FILE']
          visual_file = os.environ.get('VISUAL_FILE', '')
          has_visual  = os.environ.get('HAS_VISUAL', 'false')
          week        = os.environ['WEEK']
          password    = os.environ['GMAIL_APP_PASS']
          sender      = 'rantimor@gmail.com'

          with open(post_file, encoding='utf-8') as f:
              post_content = f.read()

          subject = f'StoreNext LinkedIn {week} — מוכן לפרסום'

          visual_note = (
              'ויזואל מצורף (visual.html)'
              if has_visual == 'true'
              else 'ויזואל לא נמצא בתיקיית final/'
          )

          sep = '=' * 50
          body = '\n'.join([
              'שלום,',
              '',
              f'פוסט LinkedIn שבועי ({week}) מוכן לפרסום.',
              visual_note,
              '',
              sep,
              '',
              post_content,
              '',
              sep,
              '',
              f'קובץ: {post_file}',
          ])

          msg = MIMEMultipart()
          msg['Subject'] = subject
          msg['From']    = sender
          msg['To']      = sender
          msg.attach(MIMEText(body, 'plain', 'utf-8'))

          if has_visual == 'true' and visual_file and os.path.exists(visual_file):
              with open(visual_file, 'rb') as f:
                  part = MIMEBase('text', 'html')
                  part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header('Content-Disposition',
                              f'attachment; filename="{week}-visual.html"')
              msg.attach(part)

          with smtplib.SMTP('smtp.gmail.com', 587) as s:
              s.starttls()
              s.login(sender, password)
              s.sendmail(sender, sender, msg.as_string())

          print(f'Email sent: {subject}')
          EOF
