name: Test Email with W23 Post

on:
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send test email with W23 post
        env:
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: |
          python3 - <<'EOF'
          import smtplib
          import os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime

          password = os.environ['GMAIL_APP_PASS']
          sender = 'rantimor@gmail.com'

          # Read the final-post.md from W23
          post_file = 'O-output/W23-linkedin-post-solution-introduction/final-post.md'
          with open(post_file, encoding='utf-8') as f:
              post_content = f.read()

          subject = f'🧪 בדיקה: StoreNext LinkedIn W23 - Solution Introduction'
          body = f"""שלום,

          זה אימייל בדיקה של הפוסט מ-W23 שמוכן לפרסום.

          {'=' * 70}

          {post_content}

          {'=' * 70}

          זמן בדיקה: {datetime.now().strftime("%Y-%m-%d %H:%M:%S")}
          קובץ: {post_file}
          """

          msg = MIMEMultipart('alternative')
          msg['Subject'] = subject
          msg['From'] = sender
          msg['To'] = sender
          msg.attach(MIMEText(body, 'plain', 'utf-8'))

          with smtplib.SMTP('smtp.gmail.com', 587) as s:
              s.starttls()
              s.login(sender, password)
              s.sendmail(sender, sender, msg.as_string())

          print(f'✅ Test email sent: {subject}')
          EOF
